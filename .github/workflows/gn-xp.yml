name: GN XP Multi-Platform Build

on:
  workflow_dispatch:
  pull_request:

# Cancel a superseded run when new commits are pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: only checkout needs the token. Artifact upload uses the
# runtime token, not GITHUB_TOKEN scopes. Widen to contents:write only if this
# workflow later publishes releases.
permissions:
  contents: read

# Update Ninja/MinGW version here
env:
  NINJA_BASE_URL: https://github.com/Alex313031/ninja-xp/releases/download/v1.13.2xp5
  MINGW_BASE_URL: https://github.com/Alex313031/mingw-build/releases/download/20261108

jobs:
  build:
    name: Build GN XP Linux + Windows x86/x64/arm64
    # Built on Ubuntu 22.04. All zips are statically linked (gen.py passes
    # -static -static-libstdc++ for Linux/MinGW), so none of them depend on the
    # runner's or the target's glibc -- the Linux arm64 zip runs on any
    # Raspberry Pi OS release. The Windows targets keep the XP baseline on
    # x86/x64 (subsystem 5.1/5.2); Windows on ARM has no XP lineage, so that
    # one targets Windows 10 (subsystem 10.0).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        # Full history + tags: gen.py derives the build number from
        # `git describe --match initial-commit`, which needs that tag and the
        # commit history. actions/checkout does a shallow, tag-less clone by
        # default, which makes git describe fail with exit 128.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        # The unversioned gcc/g++-multilib metapackages declare Conflicts: with
        # every cross gcc, so they can never coexist with g++-aarch64-linux-gnu
        # (the arm64 cross toolchain). The versioned multilib package has no
        # such conflict; all it lacks is the /usr/include/asm symlink that
        # gcc-multilib ships, which the -m32 build needs to reach the kernel
        # uapi headers (e.g. asm/errno.h) -- so create that by hand.
        run: |
          sudo apt update
          GXX_VER=$(apt-cache depends g++ | sed -n 's/.*Depends: g++-\([0-9][0-9]*\)$/\1/p' | head -n1)
          sudo apt install -y build-essential "g++-${GXX_VER}-multilib" g++-aarch64-linux-gnu python3 wget zip unzip
          [ -e /usr/include/asm ] || sudo ln -s x86_64-linux-gnu/asm /usr/include/asm

      - name: Download and set up Ninja XP
        # Use our own Ninja (ninja-build is intentionally not installed via apt):
        # unzip it into a dedicated dir and prepend that to PATH for subsequent
        # steps. Writing to $GITHUB_PATH prepends, so this ninja shadows any system copy.
        run: |
          wget "${NINJA_BASE_URL}/ninja_linux.zip"
          mkdir -p "$HOME/ninja-bin"
          unzip -o ninja_linux.zip -d "$HOME/ninja-bin"
          chmod +x "$HOME/ninja-bin/ninja"
          rm -f ninja_linux.zip
          "$HOME/ninja-bin/ninja" --version   # fail fast if it can't run here
          echo "$HOME/ninja-bin" >> "$GITHUB_PATH"

      - name: Download MinGW
        # Use our own MinGW fork for compiling Windows builds
        # Each zip unpacks to a dir named after its target arch (i686/, x64/,
        # arm64/). The arm64 one is a Linux-x64-hosted toolchain that targets
        # Windows on ARM; the distro mingw-w64 packages have no ARM64 target at
        # all, so it can only come from here.
        run: |
          for arch in i686 x64 arm64; do
            wget "${MINGW_BASE_URL}/mingw_gcc_linux_${arch}.zip"
            unzip -o "mingw_gcc_linux_${arch}.zip" -d "$HOME"
            rm -f "mingw_gcc_linux_${arch}.zip"
          done
          # Fail fast if any cross-compiler can't run on this host.
          "$HOME/i686/bin/i686-w64-mingw32-gcc" --version
          "$HOME/x64/bin/x86_64-w64-mingw32-gcc" --version
          "$HOME/arm64/bin/aarch64-w64-mingw32-gcc" --version
          echo "$HOME/x64/bin" >> "$GITHUB_PATH"
          echo "$HOME/i686/bin" >> "$GITHUB_PATH"
          echo "$HOME/arm64/bin" >> "$GITHUB_PATH"

      - name: Build for Linux/Windows
        # --all now covers all six combos: Linux x64/x86/arm64 and Windows
        # x64/x86/arm64, each in its own subshell so the per-build toolchain
        # env cannot leak between them.
        # On pull_request the checkout HEAD is an ephemeral merge commit, so take
        # the PR head SHA from the event; fall back to github.sha for other events.
        run: |
          ./build.sh --all
          SHA=${{ github.event.pull_request.head.sha || github.sha }}
          echo "SHA_SHORT=${SHA:0:6}" >> "$GITHUB_ENV"

      - name: Upload toolchain zips
        uses: actions/upload-artifact@v4
        with:
          name: gn-xp_${{ env.SHA_SHORT}}
          path: gn_*.zip
          if-no-files-found: error
